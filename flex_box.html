<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				height: 100vh;
				width: 100vw;
				margin: 0;
				padding: 12px;
				background-color: black;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.section-top {
				display: flex;
				flex: 2.25;
				gap: 12px;
			}

			.section-bottom {
				display: flex;
				flex: 1;
				gap: 12px;
			}

			.mid {
				display: flex;
				flex-direction: column;
				flex: 3;
				gap: 12px;
			}

			.row {
				display: flex;
				flex: 1;
				gap: 12px;
			}

			#box1 {
				background-color: #e63e26;
				flex: 1;
			}

			#box2 {
				background-color: #00a4d6;
				flex: 1;
			}

			#box3 {
				background-color: #e63e26;
				flex: 1.8;
			}

			#box4 {
				background-color: #eae3c9;
				flex: 1.6;
			}

			#box5 {
				background-color: #c29548;
				flex: 1;
			}

			#box6 {
				background-color: #eae3c9;
				flex: 1.3;
			}

			#box7 {
				background-color: #dca035;
				flex: 1.55;
			}

			#box8 {
				background-color: #00a4d6;
				flex: 1.55;
			}

			#box9 {
				background-color: #e63e26;
				flex: 1;
			}
		</style>
	</head>
	<body>
		<div class="section-top">
			<section id="box1"></section>

			<div class="mid">
				<div class="row">
					<section id="box2"></section>
					<section id="box3"></section>
				</div>
				<div class="row">
					<section id="box4"></section>
					<section id="box5"></section>
				</div>
			</div>

			<section id="box6"></section>
		</div>

		<div class="section-bottom">
			<section id="box7"></section>
			<section id="box8"></section>
			<section id="box9"></section>
		</div>
	</body>
</html>
